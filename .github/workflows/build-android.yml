name: Build Android PRO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare & Obfuscate Web Assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -d "images" ]; then cp -r images www/images; fi
          npm install --no-save javascript-obfuscator
          node << 'OBFEOF'
          const fs = require('fs');
          const JavaScriptObfuscator = require('javascript-obfuscator');
          let html = fs.readFileSync('www/index.html', 'utf8');
          const startTag = '<script>';
          const endTag = '</script>';
          const startIdx = html.lastIndexOf(startTag);
          const endIdx = html.lastIndexOf(endTag);
          if (startIdx !== -1 && endIdx > startIdx) {
            const rawJs = html.slice(startIdx + startTag.length, endIdx);
            const obf = JavaScriptObfuscator.obfuscate(rawJs, {
              compact: true,
              renameGlobals: false,
              identifierNamesGenerator: 'hexadecimal',
              stringArray: true,
              stringArrayRotate: true,
              stringArrayShuffle: true,
              stringArrayEncoding: ['base64'],
              stringArrayThreshold: 0.85,
              splitStrings: true,
              splitStringsChunkLength: 10,
              controlFlowFlattening: false,
              deadCodeInjection: false,
              selfDefending: false,
              disableConsoleOutput: false
            }).getObfuscatedCode();
            html = html.slice(0, startIdx + startTag.length) + obf + html.slice(endIdx);
            fs.writeFileSync('www/index.html', html, 'utf8');
            console.log('JavaScript obfuscated successfully inside APK bundle!');
          } else {
            console.error('Inline script block not found!');
            process.exit(1);
          }
          OBFEOF

      - name: Install Capacitor & Build Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml

      - name: Enable Hardened Native Bridge (Print, Share, Save & Voice)
        run: |
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -z "$MAIN_ACT" ]; then
            echo "MainActivity.java not found!"
            exit 1
          fi
          PKG_LINE=$(grep -m1 '^package ' "$MAIN_ACT")
          echo "$PKG_LINE" > "$MAIN_ACT"
          cat << 'EOF' >> "$MAIN_ACT"

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.provider.MediaStore;
          import android.speech.RecognizerIntent;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private static final int VOICE_REQ_CODE = 7742;

              private boolean isTrustedOrigin(WebView webView) {
                  if (webView == null) return false;
                  String url = webView.getUrl();
                  return url != null && (
                      url.startsWith("https://localhost") ||
                      url.startsWith("http://localhost") ||
                      url.startsWith("capacitor://localhost")
                  );
              }

              public class ProNativeBridge {
                  private final WebView webView;
                  public ProNativeBridge(WebView wv) { this.webView = wv; }

                  @JavascriptInterface
                  public void printPage(final String jobName) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (!isTrustedOrigin(webView)) return;
                              PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              if (printManager != null) {
                                  String safeName = (jobName != null && !jobName.trim().isEmpty())
                                      ? jobName.replaceAll("[^\\p{L}\\p{N}._ -]", "").trim()
                                      : "HVAC-PRO-Document";
                                  if (safeName.isEmpty()) safeName = "HVAC-PRO-Document";
                                  PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter(safeName);
                                  printManager.print(safeName, adapter, new PrintAttributes.Builder().build());
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void shareText(final String title, final String text) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (!isTrustedOrigin(webView)) return;
                              if (text == null || text.length() > 100000) return;
                              Intent sendIntent = new Intent(Intent.ACTION_SEND);
                              sendIntent.setType("text/plain");
                              sendIntent.putExtra(Intent.EXTRA_SUBJECT, title != null ? title : "");
                              sendIntent.putExtra(Intent.EXTRA_TEXT, text);
                              Intent chooser = Intent.createChooser(sendIntent, title != null ? title : "Share");
                              chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(chooser);
                          }
                      });
                  }

                  @JavascriptInterface
                  public boolean saveHtmlToDownloads(final String fileName, final String htmlContent) {
                      try {
                          if (htmlContent == null || htmlContent.length() > 2000000) return false;
                          String safeFile = (fileName != null && !fileName.trim().isEmpty())
                              ? fileName.replaceAll("[^a-zA-Z0-9._-]", "_")
                              : "HVAC-PRO.html";
                          safeFile = safeFile.replaceAll("^\\.+", "");
                          if (safeFile.isEmpty()) safeFile = "HVAC-PRO.html";
                          if (!safeFile.toLowerCase().endsWith(".html")) safeFile = safeFile + ".html";
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, safeFile);
                              values.put(MediaStore.Downloads.MIME_TYPE, "text/html");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  OutputStream out = getContentResolver().openOutputStream(uri);
                                  if (out != null) {
                                      out.write(htmlContent.getBytes(StandardCharsets.UTF_8));
                                      out.flush();
                                      out.close();
                                      return true;
                                  }
                              }
                          }
                      } catch (Exception e) {
                          return false;
                      }
                      return false;
                  }

                  @JavascriptInterface
                  public boolean startVoiceRecognition(final String langTag, final String promptText) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (!isTrustedOrigin(webView)) return;
                              try {
                                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                                  String safeLang = (langTag != null && langTag.matches("^[a-zA-Z]{2,3}(-[a-zA-Z]{2})?$")) ? langTag : "ar";
                                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, safeLang);
                                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, safeLang);
                                  intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
                                  if (promptText != null && !promptText.trim().isEmpty()) {
                                      intent.putExtra(RecognizerIntent.EXTRA_PROMPT, promptText);
                                  }
                                  startActivityForResult(intent, VOICE_REQ_CODE);
                              } catch (ActivityNotFoundException e) {
                                  webView.evaluateJavascript("window.onNativeVoiceError && window.onNativeVoiceError('NO_SPEECH_SERVICE');", null);
                              } catch (Exception e) {
                                  webView.evaluateJavascript("window.onNativeVoiceError && window.onNativeVoiceError('ERROR');", null);
                              }
                          }
                      });
                      return true;
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  boolean isDebug = (getApplicationInfo().flags & ApplicationInfo.FLAG_DEBUGGABLE) != 0;
                  WebView.setWebContentsDebuggingEnabled(isDebug);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      final WebView webView = getBridge().getWebView();
                      webView.addJavascriptInterface(new ProNativeBridge(webView), "AndroidNativeBridge");
                  }
              }

              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == VOICE_REQ_CODE) {
                      final WebView webView = (getBridge() != null) ? getBridge().getWebView() : null;
                      if (webView == null) return;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          ArrayList<String> matches = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                          if (matches != null && !matches.isEmpty()) {
                              final String jsQuoted = JSONObject.quote(matches.get(0));
                              webView.post(new Runnable() {
                                  @Override
                                  public void run() {
                                      webView.evaluateJavascript("window.onNativeVoiceResult && window.onNativeVoiceResult(" + jsQuoted + ");", null);
                                  }
                              });
                              return;
                          }
                      }
                      webView.post(new Runnable() {
                          @Override
                          public void run() {
                              webView.evaluateJavascript("window.onNativeVoiceError && window.onNativeVoiceError('CANCELLED');", null);
                          }
                      });
                  }
              }
          }
          EOF
          echo "Patched hardened $MAIN_ACT successfully!"

      - name: Generate Official App Icon & Splash
        run: |
          ICON_SRC=$(find . -maxdepth 1 -type f \( -iname "icon.png" -o -iname "icon.jpg" -o -iname "icon.jpeg" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | head -n 1 || true)
          if [ -n "$ICON_SRC" ]; then
            echo "Using icon source: $ICON_SRC"
            command -v convert >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y imagemagick)
            mkdir -p resources
            convert "$ICON_SRC" -resize 1024x1024^ -gravity center -extent 1024x1024 resources/icon-only.png
            cp resources/icon-only.png resources/icon.png
            cp resources/icon-only.png resources/icon-foreground.png
            cp resources/icon-only.png resources/icon-background.png
            convert -size 2732x2732 xc:'#0b0c10' "$ICON_SRC" -resize 900x900 -gravity center -composite resources/splash.png
            cp resources/splash.png resources/splash-dark.png
            npx --yes @capacitor/assets generate --android
          else
            echo "No icon image found!"
            exit 1
          fi

      - name: Configure R8 & Compile Android APK (Signed Release or Debug Fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat << 'PROEOF' >> android/app/proguard-rules.pro

          # Keep Native JS Bridge & Capacitor Entry Points
          -keepattributes *Annotation*
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class **$ProNativeBridge { *; }
          PROEOF

          cd android
          chmod +x gradlew

          # Auto-increment versionCode & versionName for seamless in-place APK updates
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"2.0.${{ github.run_number }}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Building hardened & signed RELEASE APK (R8 enabled)..."
            sed -i 's/minifyEnabled false/minifyEnabled true/g' app/build.gradle
            ./gradlew assembleRelease
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
            "$BUILD_TOOLS/zipalign" -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$GITHUB_WORKSPACE/HVAC-Appliances-PRO.apk" \
              app-release-aligned.apk
            "$BUILD_TOOLS/apksigner" verify "$GITHUB_WORKSPACE/HVAC-Appliances-PRO.apk"
            rm -f release.keystore app-release-aligned.apk
            echo "Signed RELEASE APK verified successfully!"
          else
            echo "WARNING: Keystore secrets not configured yet. Building obfuscated DEBUG APK..."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/HVAC-Appliances-PRO.apk"
          fi

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-Appliances-PRO-APK
          path: HVAC-Appliances-PRO.apk

      - name: Publish Direct Download Link (GitHub Release)
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest HVAC-Appliances-PRO.apk --clobber
            gh release edit latest --latest
          else
            gh release create latest HVAC-Appliances-PRO.apk --title "HVAC Appliances PRO APK" --notes "Latest hardened Android PRO APK build" --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
