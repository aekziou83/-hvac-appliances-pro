name: Build Android APK PRO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets in www
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          if [ -d "images" ]; then
            cp -r images www/images
          fi

      - name: Install Capacitor dependencies
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/app@^6.0.0

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Inject Microphone, Queries & AndroidNativeBridge
        run: |
          python3 << 'EOF'
          import json, os

          with open("capacitor.config.json", "r", encoding="utf-8") as f:
              cfg = json.load(f)
          app_id = cfg.get("appId", "com.zinnour.hvacpro")

          # 1. حقن صلاحية الميكروفون و <queries> في AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          inject_block = ""
          if "android.permission.RECORD_AUDIO" not in manifest:
              inject_block += '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if "android.speech.action.RECOGNIZE_SPEECH" not in manifest:
              inject_block += (
                  '    <queries>\n'
                  '        <intent>\n'
                  '            <action android:name="android.speech.RecognitionService" />\n'
                  '        </intent>\n'
                  '        <intent>\n'
                  '            <action android:name="android.speech.action.RECOGNIZE_SPEECH" />\n'
                  '        </intent>\n'
                  '    </queries>\n'
              )

          if inject_block:
              manifest = manifest.replace("<application", inject_block + "    <application", 1)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)

          # 2. كتابة MainActivity.java مع جسر AndroidNativeBridge الكامل
          java_dir = os.path.join("android/app/src/main/java", *app_id.split("."))
          os.makedirs(java_dir, exist_ok=True)
          main_activity_path = os.path.join(java_dir, "MainActivity.java")

          java_code = r'''package __APP_ID__;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.provider.MediaStore;
          import android.speech.RecognizerIntent;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;

          import com.getcapacitor.BridgeActivity;

          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {

              private ActivityResultLauncher<Intent> voiceLauncher;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  voiceLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          WebView webView = getBridge() != null ? getBridge().getWebView() : null;
                          if (webView != null && result.getResultCode() == Activity.RESULT_OK && result.getData() != null) {
                              ArrayList<String> matches = result.getData().getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                              if (matches != null && !matches.isEmpty()) {
                                  String spoken = matches.get(0);
                                  webView.post(() -> webView.evaluateJavascript(
                                      "window.onNativeVoiceResult(" + JSONObject.quote(spoken) + ");", null
                                  ));
                              }
                          }
                      }
                  );

                  WebView webView = getBridge() != null ? getBridge().getWebView() : null;
                  if (webView != null) {
                      webView.addJavascriptInterface(new NativeBridge(), "AndroidNativeBridge");
                  }
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public void startVoiceRecognition(String langTag, String promptText) {
                      runOnUiThread(() -> {
                          Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, (langTag != null && !langTag.isEmpty()) ? langTag : "ar");
                          intent.putExtra(RecognizerIntent.EXTRA_PROMPT, (promptText != null) ? promptText : "Speak error code");
                          try {
                              voiceLauncher.launch(intent);
                          } catch (Exception e) {
                              WebView webView = getBridge() != null ? getBridge().getWebView() : null;
                              if (webView != null) {
                                  webView.post(() -> webView.evaluateJavascript("window.onNativeVoiceError('NO_SPEECH_SERVICE');", null));
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void printPage(String jobName) {
                      runOnUiThread(() -> {
                          WebView webView = getBridge() != null ? getBridge().getWebView() : null;
                          PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                          if (printManager != null && webView != null) {
                              String name = (jobName != null && !jobName.isEmpty()) ? jobName : "HVAC-PRO";
                              PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter(name);
                              printManager.print(name, adapter, new PrintAttributes.Builder().build());
                          }
                      });
                  }

                  @JavascriptInterface
                  public void shareText(String title, String text) {
                      runOnUiThread(() -> {
                          Intent sendIntent = new Intent(Intent.ACTION_SEND);
                          sendIntent.setType("text/plain");
                          sendIntent.putExtra(Intent.EXTRA_SUBJECT, title != null ? title : "HVAC PRO");
                          sendIntent.putExtra(Intent.EXTRA_TEXT, text != null ? text : "");
                          startActivity(Intent.createChooser(sendIntent, title != null ? title : "Share"));
                      });
                  }

                  @JavascriptInterface
                  public boolean saveHtmlToDownloads(String fileName, String htmlContent) {
                      try {
                          byte[] data = htmlContent.getBytes(StandardCharsets.UTF_8);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, "text/html");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                                      if (os != null) os.write(data);
                                  }
                                  return true;
                              }
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              File file = new File(dir, fileName);
                              try (FileOutputStream fos = new FileOutputStream(file)) {
                                  fos.write(data);
                              }
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }
              }
          }
          '''.replace("__APP_ID__", app_id)

          # إزالة المسافات الزائدة من بداية أسطر الجافا
          cleaned_java = "\n".join(line[10:] if line.startswith("          ") else line for line in java_code.splitlines())
          with open(main_activity_path, "w", encoding="utf-8") as f:
              f.write(cleaned_java)

          print("Injected successfully for package:", app_id)
          EOF

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-PRO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
